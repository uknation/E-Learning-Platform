<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — SkillRise AI</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    body {
      background: var(--bg-base);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 6%;
      border-bottom: 1px solid var(--border);
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .admin-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 800;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-decoration: none;
    }
    .admin-content {
      padding: 40px 8%;
      flex: 1;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    .admin-title {
      font-size: 28px;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    .admin-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }
    .leads-table-container {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-md);
      margin-bottom: 24px;
    }
    .leads-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    .leads-table th {
      background: var(--bg-elevated);
      padding: 16px 20px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .leads-table td {
      padding: 16px 20px;
      font-size: 14px;
      color: var(--text-primary);
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .leads-table tr:last-child td {
      border-bottom: none;
    }
    .leads-table tr:hover td {
      background: var(--bg-hover);
    }
    .goal-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      background: var(--primary-glow);
      color: var(--primary-light);
      border: 1px solid rgba(136, 189, 242, 0.3);
    }
    .timestamp {
      font-size: 12px;
      color: var(--text-muted);
    }
    .empty-state {
      padding: 64px 24px;
      text-align: center;
      color: var(--text-secondary);
    }
    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="admin-header">
    <a href="/landing" class="admin-logo">
      <span>🚀</span> SkillRise AI <span style="font-size:12px;font-weight:600;color:var(--text-muted);background:var(--bg-elevated);padding:2px 8px;border-radius:4px;margin-left:4px">Admin</span>
    </a>
    <button onclick="handleLogout()" class="btn btn-ghost btn-sm" style="color:var(--text-secondary)">
      <i data-lucide="log-out" style="width:16px;height:16px;display:inline-block;vertical-align:middle;margin-right:6px"></i> Log Out
    </button>
  </header>

  <!-- Content -->
  <main class="admin-content animate-in">
    <h1 class="admin-title">Inquiry Submissions</h1>
    <p class="admin-subtitle">Manage waitlist signups and prospective users stored in MongoDB Atlas.</p>

    <!-- Table -->
    <div class="leads-table-container">
      <table class="leads-table" id="leadsTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Learning Goal</th>
            <th>Submitted At</th>
            <th style="text-align:right">Action</th>
          </tr>
        </thead>
        <tbody id="leadsBody">
          <!-- Dynamically Injected Rows -->
          <tr id="loadingRow">
            <td colspan="5" style="text-align:center;padding:40px;color:var(--text-secondary)">
              <div class="spinner" style="display:inline-block;margin-right:8px;vertical-align:middle"></div> Loading leads from MongoDB Atlas...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer" style="position:fixed;bottom:24px;right:24px;z-index:9999"></div>

  <script>
    lucide.createIcons();

    function showToast(message, type = 'info', duration = 3500) {
      const container = document.getElementById('toastContainer');
      const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ' };
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<span>${icons[type] || icons.info}</span><span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('removing');
        setTimeout(() => toast.remove(), 300);
      }, duration);
    }

    async function loadLeads() {
      try {
        const response = await fetch('/api/admin/leads');
        if (!response.ok) {
          if (response.status === 401) {
            window.location.href = '/login';
            return;
          }
          throw new Error('Failed to fetch leads');
        }
        
        const leads = await response.json();
        const leadsBody = document.getElementById('leadsBody');
        
        if (leads.length === 0) {
          leadsBody.innerHTML = `
            <tr>
              <td colspan="5" class="empty-state">
                <div class="empty-state-icon">📥</div>
                <h3 style="font-size:16px;font-weight:600;color:var(--text-primary);margin-bottom:4px">No Submissions Yet</h3>
                <p style="font-size:13px;color:var(--text-muted)">Leads from the landing page will show up here.</p>
              </td>
            </tr>`;
          return;
        }

        leadsBody.innerHTML = leads.map(lead => {
          const date = new Date(lead.created_at || new Date());
          const dateStr = date.toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' });
          return `
            <tr id="lead-${lead._id}">
              <td style="font-weight:600">${escapeHtml(lead.name)}</td>
              <td>${escapeHtml(lead.email)}</td>
              <td><span class="goal-badge">${escapeHtml(lead.goal)}</span></td>
              <td class="timestamp">${dateStr}</td>
              <td style="text-align:right">
                <button onclick="deleteLead('${lead._id}')" class="btn btn-sm btn-ghost" style="color:var(--danger)">
                  <i data-lucide="trash-2" style="width:16px;height:16px;display:inline-block;vertical-align:middle"></i> Delete
                </button>
              </td>
            </tr>`;
        }).join('');
        lucide.createIcons();
      } catch (err) {
        showToast('Error loading leads from MongoDB: ' + err.message, 'error');
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    async function deleteLead(leadId) {
      if (!confirm('Are you sure you want to delete this lead?')) return;
      
      try {
        const response = await fetch('/api/admin/delete-lead', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: leadId })
        });
        
        if (response.ok) {
          showToast('Lead deleted successfully', 'success');
          const row = document.getElementById(`lead-${leadId}`);
          if (row) row.remove();
          
          // Re-load to show empty state if last item deleted
          const remainingRows = document.querySelectorAll('#leadsBody tr');
          if (remainingRows.length === 0) {
            loadLeads();
          }
        } else {
          showToast('Failed to delete lead', 'error');
        }
      } catch (err) {
        showToast('Network error, please try again.', 'error');
      }
    }

    async function handleLogout() {
      try {
        await fetch('/api/auth/logout', { method: 'POST' });
        showToast('Log out successful', 'success');
        setTimeout(() => { window.location.href = '/landing'; }, 1000);
      } catch (err) {
        showToast('Logout failed', 'error');
      }
    }

    // Load on init
    loadLeads();
  </script>
</body>
</html>
